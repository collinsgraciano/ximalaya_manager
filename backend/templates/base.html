<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}喜马拉雅有声书管理{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background: #f5f7fa; }
        .sidebar { min-height: calc(100vh - 56px); background: #fff; border-right: 1px solid #e0e6ed; }
        .sidebar .nav-link { color: #495057; border-radius: 8px; margin: 2px 8px; padding: 8px 16px; }
        .sidebar .nav-link:hover { background: #eef2f7; }
        .sidebar .nav-link.active { background: #0d6efd; color: #fff; }
        .card { border: none; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
        .stat-card { border-left: 4px solid #0d6efd; }
        .badge-pending { background: #6c757d; }
        .badge-uploaded { background: #198754; }
        .badge-failed { background: #dc3545; }
        .badge-processing { background: #0d6efd; }
        .badge-done { background: #198754; }
        .album-cover { width: 48px; height: 48px; object-fit: cover; border-radius: 6px; }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark px-3">
    <a class="navbar-brand" href="/"><i class="bi bi-music-note-list"></i> 喜马拉雅有声书管理</a>
    <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="/api/docs" target="_blank"><i class="bi bi-code-slash"></i> API</a></li>
            <li class="nav-item"><a class="nav-link" href="/logout"><i class="bi bi-box-arrow-right"></i> 登出</a></li>
        </ul>
    </div>
</nav>

<div class="container-fluid">
<div class="row">
    <div class="col-md-2 sidebar py-3">
        <ul class="nav flex-column">
            <li class="nav-item"><a class="nav-link {% block nav_dashboard %}{% endblock %}" href="/"><i class="bi bi-speedometer2"></i> 仪表盘</a></li>
            <li class="nav-item"><a class="nav-link {% block nav_albums %}{% endblock %}" href="/albums"><i class="bi bi-collection"></i> 专辑管理</a></li>
            <li class="nav-item"><a class="nav-link {% block nav_jobs %}{% endblock %}" href="/jobs"><i class="bi bi-list-task"></i> 任务队列</a></li>
            <li class="nav-item"><a class="nav-link {% block nav_workers %}{% endblock %}" href="/workers"><i class="bi bi-hdd-network"></i> Worker</a></li>
            <li class="nav-item"><a class="nav-link {% block nav_settings %}{% endblock %}" href="/settings"><i class="bi bi-gear"></i> 全局设置</a></li>
            <li class="nav-item"><a class="nav-link {% block nav_backup %}{% endblock %}" href="/backup"><i class="bi bi-cloud-arrow-up"></i> 数据备份</a></li>
        </ul>
    </div>
    <div class="col-md-10 p-4">
        {% block content %}{% endblock %}
    </div>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
async function api(url, options = {}) {
    const res = await fetch(url, {
        headers: { 'Content-Type': 'application/json', ...options.headers },
        ...options,
    });
    if (!res.ok) {
        const err = await res.json().catch(() => ({ detail: res.statusText }));
        throw new Error(err.detail || '请求失败');
    }
    return res.json();
}

function showToast(message, type = 'success') {
    const toast = document.createElement('div');
    toast.className = `toast align-items-center text-bg-${type} border-0 position-fixed top-0 end-0 m-3`;
    toast.style.zIndex = '9999';
    toast.innerHTML = `<div class="d-flex"><div class="toast-body">${message}</div><button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button></div>`;
    document.body.appendChild(toast);
    new bootstrap.Toast(toast, { delay: 3000 }).show();
    toast.addEventListener('hidden.bs.toast', () => toast.remove());
}

function fmtTime(s) {
    if (!s) return '-';
    return new Date(s).toLocaleString('zh-CN');
}

function statusBadge(status) {
    const map = { pending: '待处理', uploaded: '已上传', failed: '失败', processing: '处理中', done: '完成', success: '已完成' };
    return `<span class="badge badge-${status}">${map[status] || status}</span>`;
}
</script>
{% block scripts %}{% endblock %}
</body>
</html>
